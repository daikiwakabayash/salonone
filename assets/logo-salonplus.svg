<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 260" aria-label="Salon+">
  <style>
    .mark{font-family:'Fraunces','Cormorant Garamond','Playfair Display','Times New Roman',Georgia,serif;font-style:italic;font-weight:300;fill:#003B36}
    .wm{font-family:'Fraunces','Cormorant Garamond','Playfair Display','Times New Roman',Georgia,serif;font-weight:500;fill:#003B36;letter-spacing:.02em}
  </style>
  <!-- Calligraphic S as italic Fraunces letterform -->
  <text x="100" y="148" text-anchor="middle" class="mark" font-size="180">S</text>
  <!-- Gold + accent (upper right of S) -->
  <g stroke="#C9A86A" stroke-width="3.5" stroke-linecap="round">
    <line x1="158" y1="58" x2="180" y2="58"/>
    <line x1="169" y1="47" x2="169" y2="69"/>
  </g>
  <!-- Wordmark "Salon+" -->
  <text x="120" y="225" text-anchor="middle" class="wm" font-size="46">Salon+</text>
</svg>
