<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" preserveAspectRatio="xMidYMid slice" font-family="'Zen Kaku Gothic New','Hiragino Sans',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F4F9F7"/>
      <stop offset="1" stop-color="#E8F1ED"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E3D3AF"/>
      <stop offset="1" stop-color="#C9A86A"/>
    </linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#003B36" flood-opacity="0.10"/></filter>
  </defs>
  <rect width="640" height="400" fill="url(#bg)"/>
  <!-- Top tab -->
  <rect x="24" y="20" width="592" height="44" rx="10" fill="#fff" filter="url(#shadow)"/>
  <circle cx="50" cy="42" r="10" fill="#003B36"/>
  <text x="72" y="47" font-size="13" fill="#13241f" font-weight="700">POSレジ・会計</text>
  <text x="180" y="47" font-size="11" fill="#5a7d72">渋谷院 / 2026-05-27 15:42</text>
  <rect x="500" y="32" width="100" height="22" rx="11" fill="#003B36"/>
  <text x="550" y="47" font-size="11" fill="#D8BE84" font-weight="700" text-anchor="middle">＋ 新規会計</text>

  <!-- Left: cart -->
  <rect x="24" y="80" width="360" height="296" rx="14" fill="#fff" filter="url(#shadow)"/>
  <text x="44" y="108" font-size="13" fill="#13241f" font-weight="700">ご利用明細</text>
  <line x1="44" y1="120" x2="364" y2="120" stroke="#E8F1ED"/>
  <g font-size="12" fill="#13241f">
    <text x="44" y="146">全身整体 60分</text>
    <text x="324" y="146" text-anchor="end" font-weight="700">¥6,600</text>
    <text x="44" y="174">骨盤矯正</text>
    <text x="324" y="174" text-anchor="end" font-weight="700">¥3,300</text>
    <text x="44" y="202">回数券（10回）</text>
    <text x="324" y="202" text-anchor="end" font-weight="700">¥38,500</text>
    <text x="44" y="230" fill="#5a7d72">指名料</text>
    <text x="324" y="230" text-anchor="end" fill="#5a7d72">¥1,100</text>
  </g>
  <line x1="44" y1="248" x2="364" y2="248" stroke="#E8F1ED"/>
  <text x="44" y="272" font-size="11" fill="#5a7d72">小計</text>
  <text x="364" y="272" text-anchor="end" font-size="12" fill="#13241f">¥49,500</text>
  <text x="44" y="294" font-size="11" fill="#5a7d72">消費税（10%）</text>
  <text x="364" y="294" text-anchor="end" font-size="12" fill="#13241f">¥4,950</text>
  <rect x="44" y="312" width="320" height="48" rx="10" fill="#02322d"/>
  <text x="60" y="342" font-size="12" fill="#cfe3de">合計</text>
  <text x="348" y="344" text-anchor="end" font-size="22" fill="#D8BE84" font-weight="800" font-family="'Fraunces',serif">¥54,450</text>

  <!-- Right: payment methods -->
  <rect x="400" y="80" width="216" height="296" rx="14" fill="#fff" filter="url(#shadow)"/>
  <text x="420" y="108" font-size="13" fill="#13241f" font-weight="700">支払方法</text>
  <line x1="420" y1="120" x2="596" y2="120" stroke="#E8F1ED"/>
  <g>
    <rect x="420" y="134" width="176" height="40" rx="8" fill="#003B36"/>
    <text x="508" y="159" font-size="12" fill="#D8BE84" font-weight="700" text-anchor="middle">クレジット</text>
  </g>
  <g>
    <rect x="420" y="182" width="84" height="40" rx="8" fill="#F4F9F7" stroke="#003B36" stroke-opacity="0.18"/>
    <text x="462" y="207" font-size="11" fill="#13241f" font-weight="600" text-anchor="middle">現金</text>
    <rect x="512" y="182" width="84" height="40" rx="8" fill="#F4F9F7" stroke="#003B36" stroke-opacity="0.18"/>
    <text x="554" y="207" font-size="11" fill="#13241f" font-weight="600" text-anchor="middle">QR</text>
  </g>
  <g>
    <rect x="420" y="230" width="84" height="40" rx="8" fill="#F4F9F7" stroke="#003B36" stroke-opacity="0.18"/>
    <text x="462" y="255" font-size="11" fill="#13241f" font-weight="600" text-anchor="middle">電子マネー</text>
    <rect x="512" y="230" width="84" height="40" rx="8" fill="#F4F9F7" stroke="#003B36" stroke-opacity="0.18"/>
    <text x="554" y="255" font-size="11" fill="#13241f" font-weight="600" text-anchor="middle">回数券</text>
  </g>
  <line x1="420" y1="288" x2="596" y2="288" stroke="#E8F1ED"/>
  <text x="420" y="310" font-size="11" fill="#5a7d72">お預かり</text>
  <text x="596" y="310" text-anchor="end" font-size="13" font-weight="700" fill="#13241f">¥60,000</text>
  <text x="420" y="332" font-size="11" fill="#5a7d72">お釣り</text>
  <text x="596" y="332" text-anchor="end" font-size="13" font-weight="700" fill="#C9A86A">¥5,550</text>

  <rect x="420" y="346" width="176" height="20" rx="6" fill="url(#gold)"/>
  <text x="508" y="361" font-size="11" fill="#23180a" font-weight="800" text-anchor="middle">会計を確定 →</text>
</svg>
