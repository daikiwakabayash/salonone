<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" preserveAspectRatio="xMidYMid slice" font-family="'Zen Kaku Gothic New','Hiragino Sans',sans-serif">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBF8F1"/>
      <stop offset="1" stop-color="#F4F9F7"/>
    </linearGradient>
    <linearGradient id="block-green" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0A4A43"/>
      <stop offset="1" stop-color="#003B36"/>
    </linearGradient>
    <linearGradient id="block-gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#D8BE84"/>
      <stop offset="1" stop-color="#C9A86A"/>
    </linearGradient>
    <filter id="shadow2"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#003B36" flood-opacity="0.10"/></filter>
  </defs>
  <rect width="640" height="400" fill="url(#bg2)"/>

  <!-- Header -->
  <rect x="24" y="20" width="592" height="44" rx="10" fill="#fff" filter="url(#shadow2)"/>
  <circle cx="50" cy="42" r="10" fill="#003B36"/>
  <text x="72" y="47" font-size="13" fill="#13241f" font-weight="700">指名線表 / 予約タイムライン</text>
  <text x="220" y="47" font-size="11" fill="#5a7d72">2026-05-27（水）</text>
  <rect x="488" y="32" width="50" height="22" rx="11" fill="#F4F9F7" stroke="#003B36" stroke-opacity="0.2"/>
  <text x="513" y="47" font-size="10" fill="#13241f" text-anchor="middle">日</text>
  <rect x="544" y="32" width="50" height="22" rx="11" fill="#003B36"/>
  <text x="569" y="47" font-size="10" fill="#D8BE84" text-anchor="middle" font-weight="700">週</text>

  <!-- Time header row -->
  <g font-size="10" fill="#5a7d72">
    <text x="148" y="92">10:00</text>
    <text x="208" y="92">11:00</text>
    <text x="268" y="92">12:00</text>
    <text x="328" y="92">13:00</text>
    <text x="388" y="92">14:00</text>
    <text x="448" y="92">15:00</text>
    <text x="508" y="92">16:00</text>
    <text x="568" y="92">17:00</text>
  </g>
  <!-- vertical grid lines -->
  <g stroke="#003B36" stroke-opacity="0.06">
    <line x1="148" y1="100" x2="148" y2="376"/>
    <line x1="208" y1="100" x2="208" y2="376"/>
    <line x1="268" y1="100" x2="268" y2="376"/>
    <line x1="328" y1="100" x2="328" y2="376"/>
    <line x1="388" y1="100" x2="388" y2="376"/>
    <line x1="448" y1="100" x2="448" y2="376"/>
    <line x1="508" y1="100" x2="508" y2="376"/>
    <line x1="568" y1="100" x2="568" y2="376"/>
  </g>

  <!-- now line -->
  <line x1="298" y1="100" x2="298" y2="376" stroke="#C9A86A" stroke-width="1.5" stroke-dasharray="4 4"/>
  <circle cx="298" cy="100" r="3.5" fill="#C9A86A"/>

  <!-- staff rows -->
  <g>
    <!-- Row 1: 山田 -->
    <rect x="24" y="106" width="592" height="58" rx="10" fill="#fff" filter="url(#shadow2)"/>
    <circle cx="48" cy="135" r="11" fill="#003B36"/>
    <text x="48" y="139" font-size="10" fill="#D8BE84" font-weight="700" text-anchor="middle">山</text>
    <text x="70" y="132" font-size="12" fill="#13241f" font-weight="700">山田 太郎</text>
    <text x="70" y="148" font-size="10" fill="#5a7d72">指名 4 / 稼働 83%</text>
    <rect x="170" y="120" width="80" height="30" rx="7" fill="url(#block-green)"/>
    <text x="210" y="139" font-size="10" fill="#D8BE84" text-anchor="middle" font-weight="700">全身60</text>
    <rect x="270" y="120" width="50" height="30" rx="7" fill="url(#block-gold)"/>
    <text x="295" y="139" font-size="10" fill="#23180a" text-anchor="middle" font-weight="700">指名</text>
    <rect x="350" y="120" width="120" height="30" rx="7" fill="url(#block-green)"/>
    <text x="410" y="139" font-size="10" fill="#D8BE84" text-anchor="middle" font-weight="700">回数券 90分</text>

    <!-- Row 2: 佐藤 -->
    <rect x="24" y="172" width="592" height="58" rx="10" fill="#fff" filter="url(#shadow2)"/>
    <circle cx="48" cy="201" r="11" fill="#003B36"/>
    <text x="48" y="205" font-size="10" fill="#D8BE84" font-weight="700" text-anchor="middle">佐</text>
    <text x="70" y="198" font-size="12" fill="#13241f" font-weight="700">佐藤 花子</text>
    <text x="70" y="214" font-size="10" fill="#5a7d72">指名 6 / 稼働 92%</text>
    <rect x="150" y="186" width="100" height="30" rx="7" fill="url(#block-gold)"/>
    <text x="200" y="205" font-size="10" fill="#23180a" text-anchor="middle" font-weight="700">指名・骨盤</text>
    <rect x="270" y="186" width="80" height="30" rx="7" fill="url(#block-green)"/>
    <text x="310" y="205" font-size="10" fill="#D8BE84" text-anchor="middle" font-weight="700">問診含</text>
    <rect x="430" y="186" width="120" height="30" rx="7" fill="url(#block-gold)"/>
    <text x="490" y="205" font-size="10" fill="#23180a" text-anchor="middle" font-weight="700">指名・全身90</text>

    <!-- Row 3: 鈴木 -->
    <rect x="24" y="238" width="592" height="58" rx="10" fill="#fff" filter="url(#shadow2)"/>
    <circle cx="48" cy="267" r="11" fill="#003B36"/>
    <text x="48" y="271" font-size="10" fill="#D8BE84" font-weight="700" text-anchor="middle">鈴</text>
    <text x="70" y="264" font-size="12" fill="#13241f" font-weight="700">鈴木 健一</text>
    <text x="70" y="280" font-size="10" fill="#5a7d72">指名 3 / 稼働 75%</text>
    <rect x="220" y="252" width="80" height="30" rx="7" fill="url(#block-green)"/>
    <text x="260" y="271" font-size="10" fill="#D8BE84" text-anchor="middle" font-weight="700">体験</text>
    <rect x="330" y="252" width="120" height="30" rx="7" fill="url(#block-green)"/>
    <text x="390" y="271" font-size="10" fill="#D8BE84" text-anchor="middle" font-weight="700">全身60</text>

    <!-- Row 4: 田中 -->
    <rect x="24" y="304" width="592" height="58" rx="10" fill="#fff" filter="url(#shadow2)"/>
    <circle cx="48" cy="333" r="11" fill="#003B36"/>
    <text x="48" y="337" font-size="10" fill="#D8BE84" font-weight="700" text-anchor="middle">田</text>
    <text x="70" y="330" font-size="12" fill="#13241f" font-weight="700">田中 みき</text>
    <text x="70" y="346" font-size="10" fill="#5a7d72">指名 5 / 稼働 88%</text>
    <rect x="170" y="318" width="120" height="30" rx="7" fill="url(#block-gold)"/>
    <text x="230" y="337" font-size="10" fill="#23180a" text-anchor="middle" font-weight="700">指名・回数券</text>
    <rect x="310" y="318" width="80" height="30" rx="7" fill="url(#block-green)"/>
    <text x="350" y="337" font-size="10" fill="#D8BE84" text-anchor="middle" font-weight="700">体験</text>
    <rect x="450" y="318" width="100" height="30" rx="7" fill="url(#block-gold)"/>
    <text x="500" y="337" font-size="10" fill="#23180a" text-anchor="middle" font-weight="700">指名・90</text>
  </g>
</svg>
